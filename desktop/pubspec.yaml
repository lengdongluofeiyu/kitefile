name: kitefile_desktop
description: "KiteFile 局域网文件传输 - 桌面端（Windows / macOS）"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 双端共享业务层（工作流 C）：模型 / §3.5 文案 / 攒批决策只写一份
  kitefile_shared:
    path: ../packages/kitefile_shared
  window_manager: ^0.4.3
  # 系统文件选择器（Windows 原生对话框，支持多选）
  file_picker: ^8.3.0
  # 系统托盘（隐藏图标区常驻；与 window_manager 同门，0.5.x 兼容当前 Flutter）
  tray_manager: ^0.5.3
  # 系统通知（Windows toast）：窗口隐藏时来文件提醒用户
  local_notifier: ^0.1.6
  # Windows 隐藏窗口拉起 daemon（CREATE_NO_WINDOW，避免启动闪终端）
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
