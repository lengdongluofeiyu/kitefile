[package]
name = "kitefile"
version = "0.1.0"
edition = "2021"
description = "LAN file transfer core engine (discovery + transfer + HTTP gateway)"
license = "MIT"

[lib]
name = "kitefile"
path = "src/lib.rs"
# cdylib 用于 Flutter / 原生端通过 FFI 直接调用
# rlib 用于纯 Rust 依赖（CLI、单元测试）
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kitefile-cli"
path = "src/bin/cli.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# mDNS service discovery
mdns-sd = "0.11"

# HTTP gateway (for web frontend)
axum = { version = "0.7", features = ["multipart", "ws", "macros"] }
# 注：原先引 tower-http 只为 CorsLayer。阶段 2 移除 CORS 后已零使用，故一并删除。
# 将来若要把 Web 前端静态资源挂到 "/"，再按需加回 tower-http 的 fs feature。

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 槽位元数据的 bitmap 字段用 base64（跨重启续传 N3 用；本阶段只落格式不写文件）。
# 它本来就在依赖树里（间接依赖），加为直接依赖不会引入新下载。
base64 = "0.22"

# Hashing / checksums
sha2 = "0.10"
# 注：xxhash-rust（xxh3）已移除——它从未被真正调用过。文件头注释里
# 「每 chunk xxhash3 校验」描述的是一个并不存在的功能（见阶段 3b）。
# chunk 级校验若要做，阶段 5b 会随加密的认证标签一起补上。

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# TLS（阶段 5 P1）：控制面 7880 / 数据面 7879 的加密与客户端证书认证。
# ring 后端：纯 C/ASM 无 cmake，Android 交叉编译友好（aws-lc-rs 需要 cmake）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
# 自签证书生成（Ed25519，首启一次）
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# TLS accept 循环里逐连接喂给 axum Router（axum 0.7 的 serve 只吃 TcpListener）
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tower = { version = "0.5", features = ["util"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
# 注：bytes 与 dashmap 已移除，src/ 下零使用（当初按"大概会用到"先加的）。
# 判断依赖是否真的在用，别用裸字符串 grep——`to_le_bytes` 这类方法名
# 会让 "bytes" 看起来像在用。要按 `bytes::` / `Bytes` / `dashmap::` 匹配。
parking_lot = "0.12"
if-addrs = "0.13"
tokio-util = { version = "0.7", features = ["io"] }
# libc：/proc/self/fd 的 dup 打开（Android SAF 零拷贝，见 transfer::open_source_file）。
# 本来就在传递依赖树里，提为直接依赖不引入新下载。
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"
sha2 = "0.10"
serde_json = "1"
# test-util：单测里 tokio::test(start_paused = true) 虚拟推进时间，
# 超时类用例不用真等 30s（A3.1 测试闸门要求「超时可注入或缩短配置」）。
tokio = { version = "1.40", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
